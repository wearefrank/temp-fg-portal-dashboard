name: Build and publish Docker images

on:
  push:
    branches:
      - master
      - dashboard-start
    # Any tag, so the existing 0.8.0 / 1.0 style keeps working alongside a v-prefixed one.
    # Note for whoever cuts the next release: Actions reads the workflow file as it exists
    # at the tagged commit, so a tag on a commit from before this trigger was added builds
    # nothing at all, however correct the tag looks.
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        run: ./mvnw test
        working-directory: ./Back-End

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./front-end

      - name: Run frontend tests
        run: npm test
        working-directory: ./front-end

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/temp-fg-portal-dashboard"

          # Every build gets an immutable tag as well as a moving one. Deploying by the
          # moving tag is what leaves a pod on a stale build: helm renders the same PodSpec
          # whatever the registry now holds, so Kubernetes creates no new pod and
          # imagePullPolicy: Always is never consulted. A tag that changes per build makes
          # the upgrade roll the pod on its own.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A release builds under its version only. No :latest - a tag is often cut from
            # a commit that is not the newest one, and moving :latest backwards would
            # silently downgrade everything that tracks it.
            echo "CONSOLE_TAGS=${IMAGE}:${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "CONSOLE_TAGS=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.CONSOLE_TAGS }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
