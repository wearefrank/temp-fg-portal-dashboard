# Local development only. Gives the console a working login with no identity provider and
# no configuration, so the whole app can be run with just:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=localdev
#   SPRING_PROFILES_ACTIVE=localdev   (container)
#
# Never enable this anywhere real. These credentials are public - they are in the
# repository - and the {noop} passwords make the app log a warning at startup saying so.
#
# This lives behind a profile rather than in application.properties on purpose. The users
# list has to default to empty, so that a deployment selecting IN_MEMORY without
# provisioning anyone refuses to start instead of quietly accepting a known password.
console.security.auth.type=IN_MEMORY

# Same names and passwords as the Keycloak realm in docker-compose.yaml, so switching
# between the two modes locally does not mean switching credentials.
console.security.auth.in-memory.users[0].username=admin
console.security.auth.in-memory.users[0].password={noop}admin
console.security.auth.in-memory.users[0].roles=gateway-user,gateway-admin

console.security.auth.in-memory.users[1].username=user
console.security.auth.in-memory.users[1].password={noop}user
console.security.auth.in-memory.users[1].roles=gateway-user
