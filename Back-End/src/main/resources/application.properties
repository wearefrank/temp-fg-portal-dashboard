spring.application.name=Back-End

apisix.default.host=http://127.0.0.1
apisix.default.control-port=9882
apisix.default.metrics-port=9881

# Which authenticator secures the console. These names match the Frank!Framework console's
# own authentication settings, so one set of properties points both products at the same
# Keycloak realm. OAUTH2 delegates login to an OpenID Connect provider; IN_MEMORY uses the
# operator-provisioned users below. An unset or unknown value fails at startup rather than
# leaving the console open.
application.security.console.authentication.type=${CONSOLE_AUTH_TYPE:OAUTH2}

# "custom" means the endpoints below are used exactly as configured. Anything else selects
# one of Spring's built-in provider presets.
application.security.console.authentication.provider=${CONSOLE_AUTH_PROVIDER:custom}

# Env var names kept as KEYCLOAK_* so existing deployments keep working.
application.security.console.authentication.clientId=${KEYCLOAK_CLIENT_ID:frank-confidential}
application.security.console.authentication.clientSecret=${KEYCLOAK_CLIENT_SECRET:frank-confidential-secret}
application.security.console.authentication.issuerUri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/frank}

# All four together, or none. Left empty they are read from the issuer's discovery document
# on first login, so a provider that is down costs that one login instead of crashlooping
# the application. Set them when discovery is unreachable or returns internal hostnames -
# the values are the ones listed at {issuerUri}/.well-known/openid-configuration.
application.security.console.authentication.authorizationUri=${KEYCLOAK_AUTHORIZATION_URI:}
application.security.console.authentication.tokenUri=${KEYCLOAK_TOKEN_URI:}
application.security.console.authentication.userInfoUri=${KEYCLOAK_USERINFO_URI:}
application.security.console.authentication.jwkSetUri=${KEYCLOAK_JWKSET_URI:}

# Not one of the Frank!Framework settings - discovery normally supplies it. Only read when
# the four endpoints above are set, and only worth setting when the provider is not
# Keycloak; otherwise it is derived from the issuer. Empty means logout clears our session
# but leaves the provider's, so the next login signs the same user straight back in.
application.security.console.authentication.endSessionUri=${KEYCLOAK_END_SESSION_URI:}

# Which claim becomes the display name. The default is "sub", a UUID.
application.security.console.authentication.userNameAttributeName=${KEYCLOAK_USERNAME_CLAIM:preferred_username}
application.security.console.authentication.scopes=${KEYCLOAK_SCOPES:openid,profile,email}

# Where the realm puts roles; they become Spring authorities, so hasRole() sees them. The
# realm's role mapper has to add them to the ID token or the access token - both switches
# off means every user signs in with no roles at all.
#
# These are client roles, so the claim carries the client id and the two have to be changed
# together: rename the client and this stops matching. Realm roles instead would be
# realm_access.roles, which is independent of the client name.
application.security.console.authentication.authoritiesClaimName=${KEYCLOAK_AUTHORITIES_CLAIM:resource_access.frank-confidential.roles}

# IN_MEMORY users, provisioned by whoever runs the console. There is no sign-up and no
# password reset: changing one means editing this and restarting. Passwords want a
# {bcrypt} prefix; {noop} works for a quick local run but warns at startup.
#
# Left empty deliberately: selecting IN_MEMORY without provisioning anyone fails at
# startup, which beats shipping a default account whose password everyone knows. For a
# local run use the localdev profile, which brings its own throwaway users.
# application.security.console.authentication.in-memory.users[0].username=admin
# application.security.console.authentication.in-memory.users[0].password={bcrypt}$2a$10$replace.me
# application.security.console.authentication.in-memory.users[0].roles=gateway-admin

# Git providers this realm brokers, so the console can read a git token from Keycloak
# instead of a personal access token. Keycloak has no public endpoint listing its identity
# providers, so it has to be stated here. Set to empty to hide the linking UI entirely.
# Only reachable under OAUTH2; IN_MEMORY deployments use personal access tokens.
git.broker.providers=${GIT_BROKER_PROVIDERS:github,gitlab}

# Pin the git connection to one repository. With this on, the console ignores the repo,
# branch and file path the browser sends and uses the values below, and the settings panel
# turns read-only. Enforced here rather than in the UI, since those are plain request
# headers anyone can forge.
#
# The access token is not pinned: it stays the user's own credential, from their Keycloak
# link or a personal access token.
git.locked.enabled=${GIT_SETTINGS_LOCKED:false}

# Which provider the pinned repository lives on: github, gitlab or gitea.
git.locked.provider=${GIT_PROVIDER:github}

# Instance URL, for gitlab and gitea. Ignored for github.
git.locked.host=${GIT_HOST:}

# owner/repo for github and gitea, owner/project for gitlab.
git.locked.repo=${GIT_REPO:}
git.locked.branch=${GIT_BRANCH:}

# The one config file users may read and write, as a path inside the repository.
git.locked.file-path=${GIT_CONFIG_PATH:}

# Optional service-account token. Left empty, each user brings their own through Keycloak
# or a personal access token and commits carry their name. Set, nobody has to enter one
# and every commit from this console is authored by whoever owns this token. It is never
# sent to the browser - the UI is only told that one exists.
git.locked.token=${GIT_TOKEN:}

# Build redirect_uri from X-Forwarded-*, otherwise a TLS-terminating proxy makes Spring
# send the internal http://pod-ip:8080 form and Keycloak rejects it. Set to "none" when
# the console is reachable directly, since these headers are then caller-controlled.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
