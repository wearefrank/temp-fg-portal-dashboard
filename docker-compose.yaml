# Pinned so the project (and its network) is called frank-gateway-console
# regardless of the directory this file sits in.
name: frank-gateway-console

services:
  apisix:
    image: ghcr.io/wearefrank/frank-gateway:master
    restart: always
    configs:
      - source: apisix_routes
        target: /usr/local/apisix/conf/apisix.yaml
      - source: apisix_config
        target: /usr/local/apisix/conf/config.yaml
    ports:
      - "9880:9080"   # HTTP proxy
      - "9881:9091"   # Prometheus metrics
      - "9882:9092"   # Control API (/v1/schema)
      - "9443:9443"   # HTTPS proxy
    env_file:
      - path: ./.env
        required: false

  prometheus:
    image: prom/prometheus:latest
    restart: always
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    # Without this the TSDB lives on the container filesystem, so every
    # `docker compose down` or `--force-recreate` starts the dashboard's history from
    # empty - the gateway's own counters reset with it and there is nothing left to
    # reconstruct them from. Loki and Grafana below already persist; this was the gap.
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # Log store for the gateway's access logs, pushed by the loki-logger plugin
  # configured in config/apisix.yaml. Loki has no UI of its own - query it through
  # Grafana below, or over HTTP at http://localhost:3100/loki/api/v1/query_range.
  loki:
    image: grafana/loki:3.5.1
    restart: always
    command: ["-config.file=/etc/loki/loki.yaml"]
    configs:
      - source: loki_config
        target: /etc/loki/loki.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"

  # Reads both Loki and Prometheus, provisioned as datasources so there is nothing
  # to click through on first start. Login is disabled: everyone is an admin, which
  # is fine for a local stack and wrong for anything else.
  grafana:
    image: grafana/grafana:11.6.1
    restart: always
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Land on Explore against Loki instead of an empty home dashboard.
      - GF_USERS_HOME_PAGE=/explore
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus

  # ---- Test rig - start with: docker compose --profile test up -d --------------
  # Two mock backends rather than one shared instance, so $upstream_addr and
  # $upstream_host differ per route in the Loki log lines the way they do against
  # the real Centric and Djuma endpoints. go-httpbin serves /anything/*, /status/*
  # and /delay/*, which is everything config/apisix.yaml asks of them.
  centric-mock:
    image: mccutchen/go-httpbin:v2.15.0
    restart: always
    profiles: [test]

  djuma-mock:
    image: mccutchen/go-httpbin:v2.15.0
    restart: always
    profiles: [test]

  # The test client, with a control panel on http://localhost:8090. Every route in
  # config/loadgen.toml runs on its own jittered schedule, with optional burst
  # windows and randomised request data, so the traffic does not arrive as one
  # flat round-robin. The panel shows what is being sent and lets you retune it
  # live; the scenario file stays the source of truth and a restart forgets the
  # overrides. Entirely separate from the console - nothing here is part of the
  # application under test.
  loadgen:
    image: python:3.13-alpine
    restart: always
    profiles: [test]
    command: ["python", "-u", "/loadgen.py"]
    configs:
      - source: loadgen_script
        target: /loadgen.py
      - source: loadgen_scenario
        target: /loadgen.toml
      - source: loadgen_ui
        target: /loadgen.html
    ports:
      # Bound to localhost only - it is a test tool that can fire arbitrary
      # requests at the gateway, and has no business being on the network.
      - "127.0.0.1:8090:8090"
    environment:
      - GATEWAY=http://apisix:9080
      # Control panel: http://localhost:8090. Set to 0 to run headless.
      - UI_PORT=8090
      # Scales every interval in the scenario at once: 0.25 is four times busier,
      # 4 is four times quieter. The knob to reach for first.
      - INTERVAL_SCALE=1.0
      # Comma-separated entry names to run, empty runs all of them.
      - ONLY=
      # Set to any fixed value to make a run reproducible.
      - SEED=
      - SUMMARY_EVERY=60
    depends_on:
      - apisix
      - centric-mock
      - djuma-mock

  # Test identity provider - start with: docker compose --profile keycloak up
  # Admin console: http://localhost:8081  (admin / admin)
  # Realm "frank" is imported on every start; changes made in the UI are lost on
  # recreate because dev mode keeps everything in an in-memory database.
  #
  # Reachable under one identity from both sides:
  #   - from your browser  : http://localhost:8081/realms/frank/...
  #   - from apisix/console: http://keycloak:8080/realms/frank/...
  # KC_HOSTNAME pins the issuer to the localhost form so browser redirects work,
  # while BACKCHANNEL_DYNAMIC lets in-network callers keep using keycloak:8080.
  # Without both, a token minted on one side fails validation on the other.
  #
  # The realm also brokers GitHub and GitLab so the console can read a user's git
  # token from Keycloak instead of asking for a personal access token. Set these in
  # .env, otherwise both providers import disabled-in-practice with "unset" creds:
  #   GITHUB_IDP_CLIENT_ID / GITHUB_IDP_CLIENT_SECRET
  #   GITLAB_IDP_CLIENT_ID / GITLAB_IDP_CLIENT_SECRET
  # The OAuth app's callback URL must be
  #   http://localhost:8081/realms/frank/broker/{github,gitlab}/endpoint
  # Both test users get their roles spelled out. Keycloak skips the default-roles composite
  # for imported users that list realmRoles, so without this they hold neither
  # account.manage-account (which the linking endpoint requires) nor broker.read-token
  # (which reading the stored token requires). addReadTokenRoleOnCreate does not cover the
  # latter either: it only fires when logging IN through the provider creates the account,
  # not when an existing account links to one.
  # Links live in the in-memory database, so recreating this container means re-linking.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: always
    profiles: [keycloak]
    command: ["start-dev", "--import-realm"]
    configs:
      - source: keycloak_realm
        target: /opt/keycloak/data/import/frank-realm.json
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8081:8080"

  # FederatedGateWay management UI - start with: docker compose --profile ui up
  console:
    image: ghcr.io/wearefrank/federated-gateway-console:latest
    restart: always
    profiles: [ui]
    ports:
      - "8080:8080"
    environment:
      - PROMETHEUS_URL=http://host.docker.internal:9090
      # The gateway's access log, pushed by the loki-logger plugin in config/apisix.yaml
      # and read back by the console's log panels. The compose Loki is reachable by
      # service name, so unlike the two above this default needs no
      # host.docker.internal hop - override it to read from a Loki elsewhere, in which
      # case point the loki-logger endpoint_addrs in config/apisix.yaml at the same one.
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      # X-Scope-OrgID, sent only when non-empty. The compose Loki runs with
      # auth_enabled: false and files every line under one tenant regardless, so this
      # matters only against a multi-tenant instance - where it has to match the
      # tenant_id the loki-logger plugin pushes under, or the console queries a tenant
      # nothing writes to.
      - LOKI_TENANT_ID=${LOKI_TENANT_ID:-}
      # Pins every log query to a namespace, by ANDing namespace="<this>" into the
      # stream selector - for a Loki several environments push to. Empty means no
      # restriction; the value has to match loki-logger.log_labels.namespace in
      # config/apisix.yaml, which is "local" here.
      #
      # A comma-separated list scopes to several at once - namespace=~"a|b" - and the log
      # tables show them merged, newest first, with a Namespace column saying which is which.
      - LOKI_NAMESPACE=${LOKI_NAMESPACE:-}
      # The label carrying it, if a collector relabelled it to something else.
      - LOKI_NAMESPACE_LABEL=${LOKI_NAMESPACE_LABEL:-namespace}
      # How far back "all" reaches, in hours. Loki has no endpoint reporting its own
      # retention, so the console is told - match this to retention_period in the queried
      # Loki's config (config/loki.yaml here). Overshooting is free: the query widens over
      # lines already deleted and returns the same rows. Undershooting silently hides data
      # Loki still holds, so guess high when the real value is unknown.
      - LOKI_RETENTION_HOURS=${LOKI_RETENTION_HOURS:-336}
      - APISIX_HOST=http://host.docker.internal
      # How users sign in: OIDC uses the Keycloak settings below, IN_MEMORY uses accounts
      # you provision yourself. To try the console without running Keycloak at all, set
      # SPRING_PROFILES_ACTIVE=localdev instead - it brings throwaway admin/admin and
      # user/user accounts and needs nothing else.
      - CONSOLE_AUTH_TYPE=${CONSOLE_AUTH_TYPE:-OIDC}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      # For a real IN_MEMORY deployment, provision accounts here instead of the profile.
      # Passwords need a {bcrypt} prefix; leave these commented out under OIDC, since an
      # empty username would be read as a user with no password and stop the app.
      # - CONSOLE_SECURITY_AUTH_IN_MEMORY_USERS_0_USERNAME=admin
      # - CONSOLE_SECURITY_AUTH_IN_MEMORY_USERS_0_PASSWORD={bcrypt}$$2a$$10$$replace.me
      # - CONSOLE_SECURITY_AUTH_IN_MEMORY_USERS_0_ROLES=gateway-user,gateway-admin
      # The keycloak profile above pins its issuer to localhost:8081, which this
      # container cannot reach, so override these to run the console in compose.
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/frank}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-frank-confidential}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-frank-confidential-secret}
    volumes:
      - backend_data:/data
    depends_on:
      - apisix
      - loki

configs:
  # Both APISIX configs live in config/ so they can be edited as ordinary YAML
  # files. Routes are re-read by APISIX within a second; the app config needs
  # `docker compose up -d --force-recreate apisix`.
  apisix_routes:
    file: ./config/apisix.yaml            # routes, upstreams, services, consumers
  apisix_config:
    file: ./config/apisix-config.yaml     # gateway settings and enabled plugins
  keycloak_realm:
    content: |
      {
        "realm": "frank",
        "enabled": true,
        "sslRequired": "none",
        "accessTokenLifespan": 3600,
        "roles": {
          "realm": [
            { "name": "gateway-user", "description": "Plain authenticated user" },
            { "name": "gateway-admin", "description": "Elevated user, for testing role-based rules" }
          ]
        },
        "groups": [
          { "name": "gateway-operators" },
          { "name": "platform-team" }
        ],
        "identityProviders": [
          {
            "alias": "github",
            "providerId": "github",
            "enabled": true,
            "trustEmail": true,
            "storeToken": true,
            "addReadTokenRoleOnCreate": true,
            "linkOnly": true,
            "hideOnLogin": true,
            "config": {
              "clientId": "${GITHUB_IDP_CLIENT_ID:-unset}",
              "clientSecret": "${GITHUB_IDP_CLIENT_SECRET:-unset}",
              "defaultScope": "read:user user:email repo",
              "githubJsonFormat": "true",
              "syncMode": "IMPORT"
            }
          },
          {
            "alias": "gitlab",
            "providerId": "gitlab",
            "enabled": true,
            "trustEmail": true,
            "storeToken": true,
            "addReadTokenRoleOnCreate": true,
            "linkOnly": true,
            "hideOnLogin": true,
            "config": {
              "clientId": "${GITLAB_IDP_CLIENT_ID:-unset}",
              "clientSecret": "${GITLAB_IDP_CLIENT_SECRET:-unset}",
              "defaultScope": "openid read_user api",
              "syncMode": "IMPORT"
            }
          }
        ],
        "clients": [
          {
            "clientId": "frank-confidential",
            "name": "Confidential client (has a secret)",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "secret": "frank-confidential-secret",
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": true,
            "redirectUris": ["http://localhost:5500/*", "http://localhost:8080/*"],
            "webOrigins": ["http://localhost:5500", "http://localhost:8080"],
            "protocolMappers": [
              {
                "name": "realm roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "config": {
                  "claim.name": "realm_access.roles",
                  "jsonType.label": "String",
                  "multivalued": "true",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "userinfo.token.claim": "true"
                }
              },
              {
                "name": "groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-group-membership-mapper",
                "config": {
                  "claim.name": "groups",
                  "full.path": "false",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "userinfo.token.claim": "true"
                }
              }
            ]
          },
          {
            "clientId": "frank-public",
            "name": "Public client (browser / SPA)",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": true,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "redirectUris": ["*"],
            "webOrigins": ["*"]
          }
        ],
        "users": [
          {
            "username": "user",
            "email": "admin@example.com",
            "firstName": "Test",
            "lastName": "User",
            "enabled": true,
            "emailVerified": true,
            "credentials": [
              { "type": "password", "value": "user", "temporary": false }
            ],
            "realmRoles": ["gateway-user"],
            "clientRoles": { "broker": ["read-token"], "account": ["view-profile", "manage-account"] },
            "groups": ["/gateway-operators"]
          },
          {
            "username": "admin",
            "email": "testadmin@example.com",
            "firstName": "Test",
            "lastName": "Admin",
            "enabled": true,
            "emailVerified": true,
            "credentials": [
              { "type": "password", "value": "admin", "temporary": false }
            ],
            "realmRoles": ["gateway-user", "gateway-admin"],
            "clientRoles": { "broker": ["read-token"], "account": ["view-profile", "manage-account"] },
            "groups": ["/platform-team"]
          }
        ]
      }
  prometheus_config:
    file: ./config/prometheus.yml
  loki_config:
    file: ./config/loki.yaml
  grafana_datasources:
    file: ./config/grafana-datasources.yaml
  loadgen_script:
    file: ./config/loadgen.py
  loadgen_scenario:
    file: ./config/loadgen.toml
  loadgen_ui:
    file: ./config/loadgen.html

volumes:
  backend_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  default:
    driver: bridge
