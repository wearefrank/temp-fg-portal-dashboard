# Frank!Gateway (APISIX) application config -> mounted at /usr/local/apisix/conf/config.yaml
#
# This is the *custom* layer: APISIX merges it over its built-in defaults, so only
# what differs from the defaults belongs here. Every available option, with its
# default value and documentation, is in config/apisix-config-default.yaml next to
# this file - copy the keys you need out of it rather than editing that file.
#
# Changing this file needs a restart, because it is read once at startup:
#   docker compose up -d --force-recreate apisix
#
# Routes, upstreams and consumers live in config/apisix.yaml instead, and are
# picked up without a restart.

apisix:
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092
  enable_admin: false
  # Where the Frank-specific plugins shipped in the image are loaded from.
  extra_lua_path: "/usr/local/apisix/custom-plugins/?.lua"
  extra_lua_cpath: "/usr/local/apisix/custom-plugin-libs/?.so"

nginx_config:
  http:
    custom_lua_shared_dict:
      fsc-registration: 1m
      openid-connect-client-cache: 1m
      generic-oauth-client-cache: 1m
      jwt-client-cache: 1m

# Listing `plugins` replaces the default set rather than adding to it, so this has
# to name every plugin the gateway should load - including the Frank ones
# (frank-sender, fsc, soap-action-router, ...) that upstream APISIX does not know
# about. Order matters only in that a plugin absent here cannot be used by a route.
plugins:
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - chaitin-waf
  - multi-auth
  - openid-connect
  - cas-auth
  - authz-casbin
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - jwt-auth
  - jwe-decrypt
  - key-auth
  - consumer-restriction
  - forward-auth
  - opa
  - authz-keycloak
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - workflow
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - gzip
  - server-info
  - traffic-split
  - redirect
  - response-rewrite
  - degraphql
  - kafka-proxy
  - grpc-transcode
  - grpc-web
  - public-api
  - prometheus
  - datadog
  - loki-logger
  - elasticsearch-logger
  - echo
  - loggly
  - http-logger
  - splunk-hec-logging
  - skywalking-logger
  - google-cloud-logging
  - sls-logger
  - tcp-logger
  - kafka-logger
  - rocketmq-logger
  - syslog
  - udp-logger
  - file-logger
  - clickhouse-logger
  - tencent-cloud-cls
  - inspect
  - example-plugin
  - cert-auth
  - frank-sender
  - generic-oauth-client
  - jwt-client
  - limit-size
  - soap-action-router
  - openid-connect-client
  - fsc
  - aws-lambda
  - azure-functions
  - openwhisk
  - openfunction
  - serverless-post-function
  - ext-plugin-post-req
  - ext-plugin-post-resp

plugin_attr:
  prometheus:
    enable_export_server: true
    export_addr:
      ip: 0.0.0.0
      port: 9091
    metrics:
      http_status:
        extra_labels:
          - upstream_addr: $upstream_addr
          - status: $upstream_status
          - soap_action: $soap_action

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
